name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-duckdb pandas numpy scikit-learn pytest

    - name: Generate synthetic seeds
      run: |
        python scripts/generate_seeds.py
        
    - name: Setup dbt profiles
      run: |
        mkdir -p ~/.dbt
        cat << 'EOF' > ~/.dbt/profiles.yml
        saas_retention_uplift:
          outputs:
            ci:
              type: duckdb
              path: 'warehouse.duckdb'
              threads: 4
          target: ci
        EOF
        
    - name: dbt dependencies and seed
      run: |
        dbt deps
        dbt seed --profiles-dir ~/.dbt

    - name: dbt build (models & tests)
      run: |
        dbt build --profiles-dir ~/.dbt

    - name: Run Pytest (Value Gate & Model Math)
      run: |
        pytest -v

